<text x="78" y="243.3" text-anchor="end" font-size="13" fill="#5a6878">10</text>
<line x1="90" y1="125.0" x2="930" y2="125.0" stroke="#e1e7ee"/>
<text x="78" y="130.0" text-anchor="end" font-size="13" fill="#5a6878">15</text>
<line x1="90.0" y1="125" x2="90.0" y2="465" stroke="#f0f3f6"/>
<text x="90.0" y="488" text-anchor="middle" font-size="13" fill="#5a6878">1 тыс</text>
<line x1="258.0" y1="125" x2="258.0" y2="465" stroke="#f0f3f6"/>
<text x="258.0" y="488" text-anchor="middle" font-size="13" fill="#5a6878">10 тыс</text>
<line x1="426.0" y1="125" x2="426.0" y2="465" stroke="#f0f3f6"/>
<text x="426.0" y="488" text-anchor="middle" font-size="13" fill="#5a6878">100 тыс</text>
<line x1="594.0" y1="125" x2="594.0" y2="465" stroke="#f0f3f6"/>
<text x="594.0" y="488" text-anchor="middle" font-size="13" fill="#5a6878">1 млн</text>
<line x1="762.0" y1="125" x2="762.0" y2="465" stroke="#f0f3f6"/>
<text x="762.0" y="488" text-anchor="middle" font-size="13" fill="#5a6878">10 млн</text>
<line x1="930.0" y1="125" x2="930.0" y2="465" stroke="#f0f3f6"/>
<text x="930.0" y="488" text-anchor="middle" font-size="13" fill="#5a6878">100 млн</text>
<polyline points="90.0,242.0 258.0,242.5 426.0,240.0 594.0,238.7 762.0,267.3 930.0,261.7" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
