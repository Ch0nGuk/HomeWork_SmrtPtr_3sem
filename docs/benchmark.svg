<line x1="90" y1="91" x2="116" y2="91" stroke="#2563eb" stroke-width="3"/>
<text x="124" y="96" font-size="14">Сырой new/delete</text>
<line x1="360" y1="91" x2="386" y2="91" stroke="#ea580c" stroke-width="3"/>
<text x="394" y="96" font-size="14">ShrdPtr</text>
<line x1="600" y1="91" x2="626" y2="91" stroke="#16a34a" stroke-width="3"/>
<text x="634" y="96" font-size="14">std::make_shared</text>
<line x1="90" y1="465.0" x2="930" y2="465.0" stroke="#e1e7ee"/>
<text x="78" y="470.0" text-anchor="end" font-size="13" fill="#5a6878">0</text>
