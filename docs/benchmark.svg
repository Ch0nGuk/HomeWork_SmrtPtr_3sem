<circle cx="90.0" cy="219.3" r="4" fill="#16a34a"/>
<circle cx="258.0" cy="220.2" r="4" fill="#16a34a"/>
<circle cx="426.0" cy="220.2" r="4" fill="#16a34a"/>
<circle cx="594.0" cy="239.8" r="4" fill="#16a34a"/>
<circle cx="762.0" cy="239.7" r="4" fill="#16a34a"/>
<circle cx="930.0" cy="240.5" r="4" fill="#16a34a"/>
<line x1="90" y1="465" x2="930" y2="465" stroke="#657387"/>
<line x1="90" y1="125" x2="90" y2="465" stroke="#657387"/>
<text x="510" y="522" text-anchor="middle" font-size="15">Число итераций N (логарифмическая шкала)</text>
<text x="25" y="300" text-anchor="middle" transform="rotate(-90 25 300)" font-size="15">Время на итерацию, нс</text>
