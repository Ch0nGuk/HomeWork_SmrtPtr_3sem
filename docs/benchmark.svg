<circle cx="258.0" cy="242.5" r="4" fill="#2563eb"/>
<circle cx="426.0" cy="240.0" r="4" fill="#2563eb"/>
<circle cx="594.0" cy="238.7" r="4" fill="#2563eb"/>
<circle cx="762.0" cy="267.3" r="4" fill="#2563eb"/>
<circle cx="930.0" cy="261.7" r="4" fill="#2563eb"/>
<polyline points="90.0,197.3 258.0,197.9 426.0,198.0 594.0,205.3 762.0,217.5 930.0,218.8" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="90.0" cy="197.3" r="4" fill="#ea580c"/>
<circle cx="258.0" cy="197.9" r="4" fill="#ea580c"/>
<circle cx="426.0" cy="198.0" r="4" fill="#ea580c"/>
